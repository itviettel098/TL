<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tính Tiền Điện</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background-color: #f0fdf4; color: #166534; }
        .card { background: white; padding: 20px; border-radius: 8px; border: 2px solid #22c55e; }
        h2 { color: #15803d; }
        label { display: block; margin: 10px 0 5px; color: #166534; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 2px solid #22c55e; border-radius: 4px; box-sizing: border-box; color: #166534; font-size: 18px; }
        .result { margin-top: 20px; padding: 15px; background: #dcfce7; border-radius: 4px; border: 1px solid #22c55e; }
        .price { font-weight: bold; color: #15803d; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="card">
    <h2>Tính Tiền Điện Xanh</h2>
    <label for="kwh">Nhập số kWh:</label>
    <input type="number" id="kwh" placeholder="Nhập số điện..." oninput="calculate()">
    
    <div id="resultArea" class="result" style="display:none;">
        <p>1 hộ: <span id="res1" class="price"></span></p>
        <p>2 hộ: <span id="res2" class="price"></span></p>
        <p>3 hộ: <span id="res3" class="price"></span></p>
        <p>4 hộ: <span id="res4" class="price"></span></p>
    </div>
</div>

<script>
    function calculate() {
        const kwh = parseFloat(document.getElementById('kwh').value);
        if (isNaN(kwh) || kwh < 0) { document.getElementById('resultArea').style.display = 'none'; return; }

        function tinhTien(kwh, soHo) {
            let tong = 0;
            const rates = [
                { limit: 50 * soHo, price: 1984 },
                { limit: 50 * soHo, price: 2050 },
                { limit: 100 * soHo, price: 2380 },
                { limit: 100 * soHo, price: 2998 },
                { limit: 100 * soHo, price: 3350 },
                { limit: Infinity, price: 3460 }
            ];
            let remaining = kwh;
            for (let r of rates) {
                if (remaining <= 0) break;
                let used = Math.min(remaining, r.limit);
                tong += used * r.price;
                remaining -= used;
            }
            return (tong * 1.08).toLocaleString('vi-VN', {style: 'currency', currency: 'VND'});
        }

        document.getElementById('res1').innerText = tinhTien(kwh, 1);
        document.getElementById('res2').innerText = tinhTien(kwh, 2);
        document.getElementById('res3').innerText = tinhTien(kwh, 3);
        document.getElementById('res4').innerText = tinhTien(kwh, 4);
        document.getElementById('resultArea').style.display = 'block';
    }
</script>
</body>
</html>
